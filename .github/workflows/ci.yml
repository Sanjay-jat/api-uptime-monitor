name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uptime
          POSTGRES_PASSWORD: uptime
          POSTGRES_DB: uptime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uptime -d uptime"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://uptime:uptime@localhost:5432/uptime
      TEST_DATABASE_URL: postgresql+asyncpg://uptime:uptime@localhost:5432/uptime_test
      JWT_SECRET: ci-only-throwaway-value-0123456789abcdef
      CORS_ORIGINS: '["http://localhost:3000"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install ".[dev]"
      - name: Lint
        run: |
          ruff format --check .
          ruff check .
      - name: Create test database
        run: PGPASSWORD=uptime psql -h localhost -U uptime -d uptime -c "CREATE DATABASE uptime_test"
      - name: Migrations on empty DB
        run: |
          alembic upgrade head
          alembic check
      - name: Tests with coverage gate
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=90